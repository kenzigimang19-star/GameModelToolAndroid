name: Build Game Model Tool APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GameModelToolAndroid_MVP02.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q GameModelToolAndroid_MVP02.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GameModelTool-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
